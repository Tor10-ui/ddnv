<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Feliz Día de la Novia 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:linear-gradient(135deg,#ff7eb3,#ff758c,#ffb6c1,#ffe4ec);
    background-size:400% 400%;
    animation:fondo 15s ease infinite;
    height:100vh;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

#inicio,
#carta,
#final{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:1s;
}

#carta,
#final{
    display:none;
}

.sobre{
    width:340px;
    height:230px;
    position:relative;
    animation:flotar 3s ease-in-out infinite;
}

@keyframes flotar{
    50%{
        transform:translateY(-12px);
    }
}

.cuerpo{
    width:100%;
    height:100%;
    background:white;
    border-radius:0 0 18px 18px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:#ff4f8b;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.cuerpo h1{
    font-size:55px;
}

.cuerpo h2{
    margin-top:8px;
    font-size:26px;
}

.cuerpo p{
    margin:10px;
    font-size:18px;
}

.tapa{
    position:absolute;
    width:100%;
    height:110px;
    background:#ff5f95;
    clip-path:polygon(0 0,50% 100%,100% 0);
    top:0;
    left:0;
    transform-origin:top;
    transition:1s;
}

button{
    margin-top:18px;
    padding:14px 28px;
    border:none;
    border-radius:40px;
    background:#ff2d75;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

button:hover{
    transform:scale(1.08);
}

.contenido{
    width:90%;
    max-width:750px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:35px;
    text-align:center;
    color:white;
    box-shadow:0 0 30px rgba(255,255,255,.35);
}

.contenido h1{
    font-family:'Dancing Script',cursive;
    font-size:56px;
}

.contenido h2{
    margin:18px 0;
    font-size:28px;
}

#mensaje{
    font-size:22px;
    line-height:1.8;
    min-height:170px;
}

#contador{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
}

#final h1{
    font-size:70px;
    color:white;
    animation:latido 1s infinite;
}

#final h2{
    margin-top:20px;
    color:white;
    text-align:center;
    font-size:36px;
}

#final p{
    margin-top:20px;
    color:white;
    font-size:24px;
}

@keyframes latido{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.12);
    }
}

#corazones{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
}

.corazon{
    position:absolute;
    bottom:-30px;
    animation:subir linear forwards;
}

@keyframes subir{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

#estrellas{
    position:fixed;
    width:100%;
    height:100%;
    pointer-events:none;
}

.estrella{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:brillar 2.5s infinite;
}

@keyframes brillar{
    50%{
        transform:scale(2);
        opacity:.3;
    }
}

@media(max-width:700px){

.sobre{
    width:300px;
    height:210px;
}

.contenido h1{
    font-size:42px;
}

.contenido h2{
    font-size:23px;
}

#mensaje{
    font-size:19px;
}

#final h1{
    font-size:52px;
}

#final h2{
    font-size:28px;
}

}

</style>

</head>

<body>

<div id="estrellas"></div>
<div id="corazones"></div>

<div id="inicio">

<div class="sobre">

<div class="tapa"></div>

<div class="cuerpo">

<h1>💌</h1>

<h2>Tengo una sorpresa para ti</h2>

<p>Mi niña de ojitos bonitos ❤️</p>

<button onclick="abrirCarta()">

Abrir mi carta 💖

</button>

</div>

</div>

</div>

<div id="carta">

<div class="contenido">

<h1>
🌹 Feliz Día de la Novia 🌹
</h1>

<h2>

Para la mejor y más hermosa novia del mundo ❤️

</h2>

<p id="mensaje"></p>

<div id="contador"></div>

<button onclick="sorpresaFinal()">

Tengo algo más que decirte... ❤️

</button>

</div>

</div>

<div id="final">

<h1>

❤️ TE AMO ❤️

</h1>

<h2>

Infinitamente, mi niña de ojitos bonitos 🥹💖

</h2>

<p>

Gracias por hacer mi vida mucho más bonita.

</p>

</div>

<script>

const mensaje = `💖 Feliz Día de la Novia, mi niña de ojitos bonitos.

Hoy solo quiero recordarte que eres el regalo más bonito que la vida me ha dado. Gracias por llenar mis días de felicidad, por regalarme tu amor y por hacer que incluso la distancia se sienta más pequeña cuando pienso en ti.

Te amo con todo mi corazón, hoy, mañana y siempre. ❤️`;

let indice = 0;

function abrirCarta(){

    document.querySelector(".tapa").style.transform="rotateX(180deg)";

    setTimeout(()=>{

        document.getElementById("inicio").style.display="none";

        document.getElementById("carta").style.display="flex";

        escribirMensaje();

    },1000);

}

function escribirMensaje(){

    const texto = document.getElementById("mensaje");

    function escribir(){

        if(indice < mensaje.length){

            texto.innerHTML += mensaje.charAt(indice);

            indice++;

            setTimeout(escribir,40);

        }

    }

    escribir();

}

function actualizarContador(){

    const inicio = new Date("2023-11-05");

    const hoy = new Date();

    let diferencia = hoy - inicio;

    let dias = Math.floor(diferencia / (1000*60*60*24));

    document.getElementById("contador").innerHTML =
    "💕 Han pasado <b>" + dias + "</b> días desde que comenzó nuestra historia ❤️";

}

setInterval(actualizarContador,1000);

actualizarContador();

function crearCorazon(){

    const corazon = document.createElement("div");

    corazon.className="corazon";

    const emojis=["❤️","💖","💕","💗","💘","🌸","🥰"];

    corazon.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

    corazon.style.left=Math.random()*100+"vw";

    corazon.style.fontSize=(18+Math.random()*25)+"px";

    corazon.style.animationDuration=(4+Math.random()*4)+"s";

    document.getElementById("corazones").appendChild(corazon);

    setTimeout(()=>{

        corazon.remove();

    },8000);

}

setInterval(crearCorazon,250);

function crearEstrella(){

    const estrella=document.createElement("div");

    estrella.className="estrella";

    estrella.style.left=Math.random()*100+"vw";

    estrella.style.top=Math.random()*100+"vh";

    estrella.style.animationDelay=Math.random()*3+"s";

    document.getElementById("estrellas").appendChild(estrella);

}

for(let i=0;i<120;i++){

    crearEstrella();

}

function sorpresaFinal(){

    document.getElementById("carta").style.display="none";

    document.getElementById("final").style.display="flex";

    for(let i=0;i<250;i++){

        setTimeout(crearCorazon,i*15);

    }

}

</script>

</body>
</html>
